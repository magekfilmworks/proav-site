        showAt = -1;
        cueTimers.forEach(clearTimeout); cueTimers = [];
        clearReady(true);
        stopSeqClock();
        take();                         // house back to 100%
        // The show is over and the sign-off has been said, so the sound goes off with it: the
        // visitor unmuted for the show, not for a wall that keeps playing at them afterwards.
        // The sound button is still there if they want it back.
        audioMode('off');
      }

      // ── The loop ─────────────────────────────────────────────────────────────────────────
      function go(n) {
        i = ((n % LOOP.length) + LOOP.length) % LOOP.length;
        show(LOOP[i], () => go(i + 1));
      }

      vid.addEventListener('play', start);
      vid.addEventListener('pause', stop);
      vid.addEventListener('seeked', draw);
      // A clip is left to finish. TAIL is the breath after its last frame before the next cue
      // is called — without it the call began in the same instant the clip ended and stepped
      // on the end of its audio, which is what "cut off at the end of the video" was.
      const TAIL = 700;
      vid.addEventListener('ended', () => {
        const go = onClipEnd;
        onClipEnd = null;
        // The slate is only cleared here if nothing called us out of the clip — an out-call's
        // own GO handles its own slate, and clearing it here would cut the call short.
        // `go` must still be set, too: endWatch hands on a frame or two BEFORE 'ended'
        // arrives, and by the time it does the next step has its own call on the wall.
        // Clearing then wiped a slate that was not ours — which is how the whole of
        // "GFX 1, Slide 1, GO." came to be called with nothing on screen.
        if (go && !outFired) clearReady();
        if (go) go();
      });
      // A clip that stalls on its final frame without firing 'ended' would hold the stack, so
      // the frame loop watches for the playhead reaching the end as well.
      const endWatch = () => {
        if (cur && cur.kind === 'video' && vid.duration &&
            vid.currentTime >= vid.duration - 0.04 && onClipEnd) {
          const go = onClipEnd; onClipEnd = null; go();
        }
      };

      if ('IntersectionObserver' in window) {
        new IntersectionObserver(([e]) => {
          onScreen = e.isIntersecting;
          // off screen, a card's hold timer keeps running; only the rAF readout is parked
          onScreen ? start() : stop();
        }, { threshold: 0 }).observe(vid);
      }

      // The wall's controls, for the sound button below and for picking a VO voice while this
      // is still a prototype. From the console:
      //   proavCue.vo.list().map(v => v.name)   every voice this machine has
      //   proavCue.vo.pick('male')              or 'female', or an exact voice name
      //   proavCue.replay()                     put the levels back up and call CUE 1 again
      window.proavCue = {
        vo: VO,
        take,
        // back to the top: levels up, show unstarted, the wall holding its invitation
        replay() { take(); showAt = 0; show({ kind: 'invite' }, () => {}); }
      };

      // Starting the show. This press is doing two jobs at once: it is the visitor asking for
      // the show, and it is the user gesture that makes audio legal for the rest of the visit.
      // Priming the video here — one muted play() while we still have the gesture — is what
      // lets the first clip start with sound later without being refused.
      if (invite) {
        invite.addEventListener('click', () => {
          try { vid.muted = true; const r = vid.play(); if (r && r.catch) r.catch(() => {}); } catch (e) {}
          VO.pick(VO.current() ? VO.current().name : 'male');
          VO.pickOp('female');   // by now the voice list has certainly loaded
          VO.warm();            // start pulling the 25 recordings down on the same press
          audioMode('on');      // sound is on from here: clips audible, voice ducking them
          startSeqClock();      // the sequence clock runs from the press
          runShow(0);           // the cue stack, from CUE 1
        });
      }

      // Everything on the wall — the standby, the take, the dim it fires — waits for the site
      // to finish loading, so the cue is called against a settled page rather than racing the
      // fonts and the first clip. If load has already gone by, start now.
      const roll = () => show({ kind: 'invite' }, () => {});
      if (document.readyState === 'complete') roll();
      else addEventListener('load', roll, { once: true });

      // There is deliberately NO timer that takes the cue on its own. The take build is the
      // only caller, so the levels cannot move before the wall has said they will.
    })();
</script>
