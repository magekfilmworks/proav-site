<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engine readout</title>
<style>
 html,body{margin:0;background:#000}
 #f{position:fixed;inset:0;width:100%;height:100%;border:0}
 #o{position:fixed;inset:0;margin:0;overflow:auto;background:rgba(0,0,0,.94);color:#0f0;
    font:14px/1.6 ui-monospace,Menlo,monospace;padding:20px 22px;white-space:pre;
    -webkit-user-select:text;user-select:text}
</style></head><body>
<iframe id="f" src="/"></iframe>
<pre id="o">measuring...</pre>
<script>
document.getElementById('f').addEventListener('load', function () {
  setTimeout(function () {
    var fr = document.getElementById('f'), w = fr.contentWindow, d = w.document;
    function S(q,p){ try { return w.getComputedStyle(d.querySelector(q)).getPropertyValue(p).trim() || '-'; }
                     catch(e){ return 'ERR'; } }
    function B(q){ try { return d.querySelector(q).getBoundingClientRect(); } catch(e){ return null; } }
    function F(q){ var r=B(q); return r ? ('x '+Math.round(r.x)+'   w '+Math.round(r.width)+'   h '+Math.round(r.height)) : 'ERR'; }
    function sup(p,v){ try { return w.CSS.supports(p,v) ? 'yes' : 'NO'; } catch(e){ return '?'; } }
    function vid(n){ var v=d.querySelectorAll('video')[n];
      return v ? (v.readyState+'  '+(v.paused?'paused':'playing')+'  '+v.videoWidth+'x'+v.videoHeight) : 'none'; }

    var word = B('.hero-word'), wall = B('.hero-screen');
    var inkR = parseFloat(S('.hero','--ink-r'));
    var inkEnd = (word && isFinite(inkR)) ? Math.round(word.x + word.width * inkR) : null;
    var gap = (inkEnd !== null && wall) ? Math.round(wall.x - inkEnd) : null;

    var rows = [
      ['viewport', w.innerWidth + ' x ' + w.innerHeight + '    dpr ' + w.devicePixelRatio],
      ['html zoom', S('html','zoom')],
      ['--shell', S('.hero','--shell')],
      ['--hero-left', S('.hero','--hero-left')],
      ['--col-left', S('.hero','--col-left')],
      ['--word-w', S('.hero','--word-w')],
      ['--ink-l', S('.hero','--ink-l')],
      ['--ink-r', S('.hero','--ink-r')],
      ['.hero-word', F('.hero-word')],
      ['.hero-screen', F('.hero-screen')],
      ['', ''],
      ['PROAV ink ends at', inkEnd === null ? 'ERR' : inkEnd + ' px'],
      ['wall starts at', wall ? Math.round(wall.x) + ' px' : 'ERR'],
      ['GAP', gap === null ? 'ERR' : (gap + ' px' + (gap < 0 ? '   <<<< OVERLAP' : ''))],
      ['', ''],
      ['face resolved', S('.hero-word svg text','font-family')],
      ['wall video', vid(0)],
      ['logo video', vid(1)],
      ['supports zoom', sup('zoom','0.95')],
      ['supports aspect-ratio', sup('aspect-ratio','750/293')],
      ['supports container-type', sup('container-type','inline-size')],
      ['supports cqw', sup('width','10cqw')],
      ['supports mask-image', sup('mask-image','url(a.svg)')],
      ['supports text-wrap', sup('text-wrap','balance')],
      ['UA', w.navigator.userAgent.slice(0,130)]
    ];
    var out = rows.map(function(r){ return r[0] ? (r[0] + '                        ').slice(0,26) + r[1] : ''; }).join('\n');
    document.getElementById('o').textContent = out + '\n\n(temporary file: diag.html in the repo folder — delete when done)';
  }, 1500);
});
</script></body></html>
