<style>
  :root {
    --stage-black: #0B0B0D;
    --tungsten-amber: #FF9C3D;
    --data-cyan: #2AD9EC;
    --signal-white: #F5F5F0;
    --graphite: #4A4A52;
    --graphite-light: #8a8a92;
    --border-quiet: rgba(245,245,240,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    background: var(--stage-black);
    overflow-x: hidden;   /* the clock makes the page taller, so let it scroll rather than clip */
  }
  body {
    min-height: 100vh;
    min-height: 100svh;   /* svh where supported, so a phone's address bar doesn't shift it */
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif;
    position: relative;
  }

  /* soft ambient glow, echoing the hero section's backdrop */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 900px 500px at 30% 20%, rgba(255,156,61,0.07), transparent 60%),
      radial-gradient(ellipse 900px 500px at 75% 85%, rgba(42,217,236,0.07), transparent 60%);
    pointer-events: none;
  }

  /* corner brackets, matching the hero's framing device */
  .bracket {
    position: fixed; width: 56px; height: 56px;
    border-color: var(--border-quiet); opacity: 0.7;
  }
  .bracket.tl { top: 28px; left: 28px; border-top: 1px solid; border-left: 1px solid; }
  .bracket.tr { top: 28px; right: 28px; border-top: 1px solid; border-right: 1px solid; }
  .bracket.bl { bottom: 28px; left: 28px; border-bottom: 1px solid; border-left: 1px solid; }
  .bracket.br { bottom: 28px; right: 28px; border-bottom: 1px solid; border-right: 1px solid; }

  .splash { position: relative; z-index: 1; text-align: center; padding: 0 24px; }

  .splash-logo { width: min(560px, 82vw); margin: 0 auto; display: block; }

  .splash-tagline {
    margin-top: 28px;
    font-size: 13px; letter-spacing: 0.32em;
    color: var(--graphite-light);
    text-transform: uppercase;
  }

  .splash-coming {
    margin-top: 56px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 3.4vw, 30px);
    letter-spacing: 0.06em;
    color: var(--signal-white);
    text-transform: uppercase;
  }
  .splash-coming .accent { color: var(--tungsten-amber); }

  /* the clock. Hairline cells, in the same condensed face as the line above it. */
  .countdown {
    margin-top: 26px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .cd-cell {
    min-width: 86px;
    padding: 12px 10px 10px;
    border: 1px solid var(--border-quiet);
  }
  .cd-num {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 5vw, 44px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--signal-white);
  }
  /* seconds carry the accent, so one thing on the page is visibly live */
  .cd-cell.live .cd-num { color: var(--data-cyan); }
  .cd-label {
    display: block;
    margin-top: 8px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--graphite-light);
  }
  .cd-until {
    margin-top: 14px;
    font-size: 11px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--graphite-light);
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .splash-sub {
    margin-top: 14px;
    font-size: 14.5px;
    color: var(--graphite-light);
    max-width: 420px;
    margin-left: auto; margin-right: auto;
    line-height: 1.6;
  }
  .splash-sub a { color: var(--signal-white); text-decoration: none; border-bottom: 1px solid var(--border-quiet); }
  .splash-sub a:hover { border-color: var(--signal-white); }

  @media (max-width: 420px) {
    .countdown { gap: 6px; }
    .cd-cell { min-width: 0; flex: 1 1 0; padding: 10px 4px 8px; }
    .cd-label { letter-spacing: 0.12em; font-size: 9px; }
  }

  @media (max-height: 700px) {
    .splash-logo { width: min(340px, 60vw); }
    .splash-tagline { margin-top: 14px; }
    .splash-coming { margin-top: 20px; }
    .countdown { margin-top: 16px; }
    .cd-num { font-size: clamp(24px, 4vw, 34px); }
    .cd-until { margin-top: 10px; }
    .splash-sub { margin-top: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>

<div class="bracket tl"></div>
<div class="bracket tr"></div>
<div class="bracket bl"></div>
<div class="bracket br"></div>

<div class="splash">
  <svg class="splash-logo" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ProAV Podcast">
    <defs>
      <mask id="stencilMaskSplash" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="420">
        <rect x="0" y="0" width="1200" height="420" fill="white"/>
        <rect x="0" y="135" width="1200" height="13" fill="black"/>
        <rect x="0" y="180" width="1200" height="12" fill="black"/>
        <rect x="0" y="224" width="1200" height="13" fill="black"/>
      </mask>
      <linearGradient id="signalSplash" gradientUnits="userSpaceOnUse" x1="300" y1="280" x2="900" y2="280">
        <stop offset="0%" stop-color="#FF9C3D"/>
        <stop offset="50%" stop-color="#F5F5F0"/>
        <stop offset="100%" stop-color="#2AD9EC"/>
        <animateTransform attributeName="gradientTransform" type="translate" values="-300 0; 300 0; -300 0" dur="3.5s" repeatCount="indefinite"/>
      </linearGradient>
    </defs>
    <g mask="url(#stencilMaskSplash)">
      <text x="600" y="220" text-anchor="middle"
            font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif"
            font-size="200" letter-spacing="2" fill="#F5F5F0">PROAV</text>
    </g>
    <rect x="300" y="275" width="600" height="10" fill="url(#signalSplash)"/>
    <text x="600" y="345" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold"
          font-size="56" letter-spacing="22" fill="#F5F5F0" opacity="0.75">PODCAST</text>
  </svg>

  <div class="splash-tagline">Mainstage &middot; Backstage &middot; Cloud</div>

  <div class="splash-coming">Coming <span class="accent">December</span> 2026</div>

  <!-- Digits are hidden from screen readers, which would otherwise announce every tick; the
       plain-language line below them is updated once a minute instead. -->
  <div class="countdown" role="timer">
    <div class="cd-cell"><span class="cd-num" id="cd-d" aria-hidden="true">--</span><span class="cd-label">Days</span></div>
    <div class="cd-cell"><span class="cd-num" id="cd-h" aria-hidden="true">--</span><span class="cd-label">Hrs</span></div>
    <div class="cd-cell"><span class="cd-num" id="cd-m" aria-hidden="true">--</span><span class="cd-label">Min</span></div>
    <div class="cd-cell live"><span class="cd-num" id="cd-s" aria-hidden="true">--</span><span class="cd-label">Sec</span></div>
  </div>
  <div class="cd-until" id="cd-until">Until December 31</div>
  <p class="sr-only" id="cd-sr"></p>

  <div class="splash-sub">
    Real gear, real crews, real conversations — from the rig on stage to the
    cloud infrastructure taking live production remote.
    Questions? <a href="mailto:contact@proavpodcast.fm">contact@proavpodcast.fm</a>
  </div>
</div>

<script>
(function () {
  // The moment being counted to, as one fixed instant rather than a local date, so everyone sees
  // the same number wherever they are. -04:00 is Atlantic time on that date. This line is the
  // only thing to change to move the launch.
  var TARGET = new Date('2026-12-31T00:00:00-04:00');

  var d = document.getElementById('cd-d'), h = document.getElementById('cd-h'),
      m = document.getElementById('cd-m'), s = document.getElementById('cd-s'),
      sr = document.getElementById('cd-sr'), until = document.getElementById('cd-until');
  var pad = function (n) { return n < 10 ? '0' + n : String(n); };
  var lastMin = -1, timer;

  function tick() {
    var left = TARGET - new Date();

    if (left <= 0) {                     // past the date: hold at zero rather than counting up
      d.textContent = h.textContent = m.textContent = s.textContent = '00';
      until.textContent = 'ProAV is live';
      sr.textContent = 'ProAV is live.';
      clearInterval(timer);
      return;
    }

    var secs = Math.floor(left / 1000);
    var days = Math.floor(secs / 86400);
    var hrs  = Math.floor(secs % 86400 / 3600);
    var mins = Math.floor(secs % 3600 / 60);

    d.textContent = pad(days);
    h.textContent = pad(hrs);
    m.textContent = pad(mins);
    s.textContent = pad(secs % 60);

    if (mins !== lastMin) {              // once a minute, not once a second
      lastMin = mins;
      sr.textContent = days + ' days, ' + hrs + ' hours and ' + mins +
                       ' minutes until the first episode.';
    }
  }

  tick();
  timer = setInterval(tick, 1000);

  // The sweeping gradient under the wordmark is an SVG animation, which the reduced-motion rule
  // in the stylesheet cannot reach — it only stops CSS animations. Stop it here instead.
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var svg = document.querySelector('.splash-logo');
    if (svg && svg.pauseAnimations) svg.pauseAnimations();
  }
})();
</script>

</body>
