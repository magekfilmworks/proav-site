<style>
  :root {
    --stage-black: #0B0B0D;
    --tungsten-amber: #FF9C3D;
    --data-cyan: #2AD9EC;
    --signal-white: #F5F5F0;
    --graphite: #4A4A52;
    --graphite-light: #8a8a92;
    --border-quiet: rgba(245,245,240,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--stage-black);
    overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif;
    position: relative;
  }

  /* soft ambient glow, echoing the hero section's backdrop */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 900px 500px at 30% 20%, rgba(255,156,61,0.07), transparent 60%),
      radial-gradient(ellipse 900px 500px at 75% 85%, rgba(42,217,236,0.07), transparent 60%);
    pointer-events: none;
  }

  /* corner brackets, matching the hero's framing device */
  .bracket {
    position: fixed; width: 56px; height: 56px;
    border-color: var(--border-quiet); opacity: 0.7;
  }
  .bracket.tl { top: 28px; left: 28px; border-top: 1px solid; border-left: 1px solid; }
  .bracket.tr { top: 28px; right: 28px; border-top: 1px solid; border-right: 1px solid; }
  .bracket.bl { bottom: 28px; left: 28px; border-bottom: 1px solid; border-left: 1px solid; }
  .bracket.br { bottom: 28px; right: 28px; border-bottom: 1px solid; border-right: 1px solid; }

  .splash { position: relative; z-index: 1; text-align: center; padding: 0 24px; }

  .splash-logo { width: min(560px, 82vw); margin: 0 auto; display: block; }

  .splash-tagline {
    margin-top: 28px;
    font-size: 13px; letter-spacing: 0.32em;
    color: var(--graphite-light);
    text-transform: uppercase;
  }

  .splash-coming {
    margin-top: 56px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 3.4vw, 30px);
    letter-spacing: 0.06em;
    color: var(--signal-white);
    text-transform: uppercase;
  }
  .splash-coming .accent { color: var(--tungsten-amber); }

  .splash-sub {
    margin-top: 14px;
    font-size: 14.5px;
    color: var(--graphite-light);
    max-width: 420px;
    margin-left: auto; margin-right: auto;
    line-height: 1.6;
  }
  .splash-sub a { color: var(--signal-white); text-decoration: none; border-bottom: 1px solid var(--border-quiet); }
  .splash-sub a:hover { border-color: var(--signal-white); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>

<div class="bracket tl"></div>
<div class="bracket tr"></div>
<div class="bracket bl"></div>
<div class="bracket br"></div>

<div class="splash">
  <svg class="splash-logo" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ProAV Podcast">
    <defs>
      <mask id="stencilMaskSplash" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="420">
        <rect x="0" y="0" width="1200" height="420" fill="white"/>
        <rect x="0" y="135" width="1200" height="13" fill="black"/>
        <rect x="0" y="180" width="1200" height="12" fill="black"/>
        <rect x="0" y="224" width="1200" height="13" fill="black"/>
      </mask>
      <linearGradient id="signalSplash" gradientUnits="userSpaceOnUse" x1="300" y1="280" x2="900" y2="280">
        <stop offset="0%" stop-color="#FF9C3D"/>
        <stop offset="50%" stop-color="#F5F5F0"/>
        <stop offset="100%" stop-color="#2AD9EC"/>
        <animateTransform attributeName="gradientTransform" type="translate" values="-300 0; 300 0; -300 0" dur="3.5s" repeatCount="indefinite"/>
      </linearGradient>
    </defs>
    <g mask="url(#stencilMaskSplash)">
      <text x="600" y="220" text-anchor="middle"
            font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif"
            font-size="200" letter-spacing="2" fill="#F5F5F0">PROAV</text>
    </g>
    <rect x="300" y="275" width="600" height="10" fill="url(#signalSplash)"/>
    <text x="600" y="345" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif" font-weight="bold"
          font-size="56" letter-spacing="22" fill="#F5F5F0" opacity="0.75">PODCAST</text>
  </svg>

  <div class="splash-tagline">Mainstage &middot; Backstage &middot; Cloud</div>

  <div class="splash-coming">Coming <span class="accent">Fall/Winter</span> 2026</div>

  <div class="splash-sub">
    Real gear, real crews, real conversations — from the rig on stage to the
    cloud infrastructure taking live production remote.
    Questions? <a href="mailto:contact@proavpodcast.com">contact@proavpodcast.fm</a>
  </div>
</div>

</body>
</html>
