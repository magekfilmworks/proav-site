<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>calc test</title>
<style>
 html{zoom:.95}                       /* the site carries this — it is part of the test */
 body{margin:0;background:#000;color:#0f0;font:14px/1.7 ui-monospace,Menlo,monospace;padding:18px}
 #box{position:relative;width:1000px;max-width:calc(100% - 40px);height:1px}
 .t{position:absolute;right:0;height:1px}
 /* the site's real shape */
 #box{--hero-left:24px;--col-left:38px;--word-w:1341px;--ink-r:.44833;}
 #a{--g:2.3vw;  width:calc(100% - var(--g))}
 #b{--g:32px;   width:calc(100% - var(--g))}
 #c{--g:2.3%;   width:calc(100% - var(--g))}
 #d{           width:calc(100% - 2.3vw)}
 #e{--g:2.3vw;  width:calc(100% - var(--hero-left) - var(--col-left) - var(--word-w)*var(--ink-r) - var(--g))}
 #f{           width:calc(100% - var(--hero-left) - var(--col-left) - var(--word-w)*var(--ink-r) - 2.3vw)}
 #g{--g:32px;   width:calc(100% - var(--hero-left) - var(--col-left) - var(--word-w)*var(--ink-r) - var(--g))}
 #h{--g:2.3vw;  width:calc(100% - var(--g) - var(--hero-left) - var(--col-left) - var(--word-w)*var(--ink-r))}
 #i{--g:calc(var(--word-w)*.0238); width:calc(100% - var(--hero-left) - var(--col-left) - var(--word-w)*var(--ink-r) - var(--g))}
</style></head><body>
<div id="box">
 <div class="t" id="a"></div><div class="t" id="b"></div><div class="t" id="c"></div>
 <div class="t" id="d"></div><div class="t" id="e"></div><div class="t" id="f"></div>
 <div class="t" id="g"></div><div class="t" id="h"></div><div class="t" id="i"></div>
</div>
<pre id="out">measuring...</pre>
<script>
addEventListener('load', function () {
  var box = document.getElementById('box');
  var W = box.getBoundingClientRect().width;
  var rows = [
    ['a', 'var(--g)=2.3vw        simple'],
    ['b', 'var(--g)=32px         simple'],
    ['c', 'var(--g)=2.3%         simple'],
    ['d', '2.3vw inline          simple'],
    ['e', 'var(--g)=2.3vw        FULL SHAPE  <-- the site'],
    ['f', '2.3vw inline          FULL SHAPE'],
    ['g', 'var(--g)=32px         FULL SHAPE'],
    ['h', 'var(--g)=2.3vw first  FULL SHAPE'],
    ['i', 'var(--g)=calc(word-w*.0238)  FULL SHAPE']
  ];
  var base = 1341 * 0.44833 + 24 + 38;          // everything except the gap
  var o = 'viewport ' + innerWidth + '   box ' + W.toFixed(1) + 'px   2.3vw = ' +
          (innerWidth * 0.023).toFixed(1) + 'px\n' +
          'expected gap term: simple = 2.3vw or 32px;  FULL SHAPE width = box - ' +
          base.toFixed(0) + ' - gap\n\n';
  rows.forEach(function (r) {
    var w = document.getElementById(r[0]).getBoundingClientRect().width;
    var full = r[1].indexOf('FULL') >= 0;
    var gap = full ? (W - base - w) : (W - w);
    o += '  ' + r[0] + '  ' + (r[1] + '                                  ').slice(0, 36) +
         'width ' + w.toFixed(1).padStart(8) + '   gap term ' + gap.toFixed(1).padStart(7) +
         (Math.abs(gap) < 1 ? '   <<<< DROPPED' : '') + '\n';
  });
  document.getElementById('out').textContent = o + '\n(temporary: calctest.html — delete when done)';
});
</script></body></html>
